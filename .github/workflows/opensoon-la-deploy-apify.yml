name: Deploy OpenSoon LA to Apify

on:
  workflow_dispatch:

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Apify CLI
        run: npm install -g apify-cli

      - name: Validate Apify schemas
        run: apify validate-schema

      - name: Unit tests
        run: npm test

      - name: Syntax checks
        run: npm run check

      - name: Build Actor Docker image
        run: docker build -t opensoon-la:deploy .

      - name: Live LA Open Data smoke test
        run: npm run live-smoke

      - name: Push Actor to Apify
        id: push
        uses: apify/push-actor-action@v1
        with:
          token: ${{ secrets.APIFY_TOKEN }}

      - name: Print Apify build result
        run: |
          echo "Build ${{ steps.push.outputs.build-id }} finished with status ${{ steps.push.outputs.build-status }}"
